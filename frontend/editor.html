<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctis - Excalidraw Clone</title>
  <meta name="description" content="Infinite canvas with Excalidraw-like UI." />
  <link rel="stylesheet" href="editor.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body class="dark-theme">

  <div class="workspace-container">
    <main class="canvas-wrapper">
      <canvas id="canvas" class="infinite-canvas"></canvas>
    </main>

    <header class="workspace-overlay workspace-header">
      <div class="header-left">
        <button class="icon-btn" id="menu-toggle-btn" title="Main Menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>

      <div class="header-center">
        <div class="toolbar" id="toolbar" role="toolbar">
          <button class="toolbar-btn" data-tool="lock" id="tool-lock" title="Keep selected tool active after drawing">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </button>
          
          <div class="toolbar-divider"></div>

          <button class="toolbar-btn" data-tool="hand" id="tool-hand" title="Hand (Panning tool) - H">
            <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8.5"></path><path d="M6 14v2a7 7 0 0 0 14 0v-5"></path></svg>
          </button>

          <button class="toolbar-btn active" data-tool="select" id="tool-select" title="Selection — 1">
            <svg viewBox="0 0 24 24"><polygon points="5 3 24 12 13 14 5 21 5 3"></polygon></svg>
            <span class="tool-shortcut">1</span>
          </button>

          <button class="toolbar-btn" data-tool="rectangle" id="tool-rectangle" title="Rectangle — 2">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
            <span class="tool-shortcut">2</span>
          </button>

          <button class="toolbar-btn" data-tool="diamond" id="tool-diamond" title="Diamond — 3">
            <svg viewBox="0 0 24 24"><polygon points="12 2 22 12 12 22 2 12 12 2"></polygon></svg>
            <span class="tool-shortcut">3</span>
          </button>

          <button class="toolbar-btn" data-tool="circle" id="tool-circle" title="Ellipse — 4">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>
            <span class="tool-shortcut">4</span>
          </button>

          <button class="toolbar-btn" data-tool="arrow" id="tool-arrow" title="Arrow — 5">
            <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"></line><polyline points="12 5 19 5 19 12"></polyline></svg>
            <span class="tool-shortcut">5</span>
          </button>

          <button class="toolbar-btn" data-tool="line" id="tool-line" title="Line — 6">
            <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
            <span class="tool-shortcut">6</span>
          </button>

          <button class="toolbar-btn" data-tool="pencil" id="tool-pencil" title="Draw — 7">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            <span class="tool-shortcut">7</span>
          </button>

          <button class="toolbar-btn" data-tool="text" id="tool-text" title="Text — 8">
            <svg viewBox="0 0 24 24"><text x="12" y="18" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">A</text></svg>
            <span class="tool-shortcut">8</span>
          </button>

          <button class="toolbar-btn" data-tool="image" id="tool-image" title="Insert image — 9">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span class="tool-shortcut">9</span>
          </button>

          <button class="toolbar-btn" data-tool="eraser" id="tool-eraser" title="Eraser — 0">
            <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16C1.5 14.5 1.5 12 3 10.5L12 1.5C13.5 0 16.0 0 17.5 1.5L21.5 5.5C23 7 23 9.5 21.5 11.0L16 16.5L20 20Z"></path><line x1="6" y1="11" x2="14" y2="19"></line></svg>
            <span class="tool-shortcut">0</span>
          </button>
        </div>
        <div class="canvas-helper-text" id="helper-text">
          To move canvas, hold <span class="kbd">Scroll wheel</span> or <span class="kbd">Space</span> while dragging, or use the hand tool
        </div>
      </div>

      <div class="header-right">
        <button class="btn-dark" id="upgrade-btn">Excalidraw+</button>
        <button class="share-btn" id="share-btn">Share</button>
        <button class="icon-btn-right" id="sidebar-toggle-btn" title="Toggle Sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="3" x2="16" y2="21"></line></svg>
        </button>
      </div>
    </header>

    <aside class="menu-drawer" id="menu-drawer">
      <nav class="menu-links">
        <button class="menu-item" id="menu-open">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Open
          <span class="shortcut">Ctrl+O</span>
        </button>
        <button class="menu-item" id="menu-save">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          Save to...
        </button>
        <button class="menu-item" id="menu-export">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export image...
          <span class="shortcut">Ctrl+Shift+E</span>
        </button>
        <button class="menu-item" id="menu-collab">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Live collaboration...
        </button>
        <button class="menu-item" id="menu-palette">
          <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Command palette
          <span class="shortcut">Ctrl+/</span>
        </button>
        <button class="menu-item" id="menu-find">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Find on canvas
          <span class="shortcut">Ctrl+F</span>
        </button>
        <button class="menu-item" id="menu-help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          Help
          <span class="shortcut">?</span>
        </button>
        <button class="menu-item" id="menu-reset">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><polyline points="16 3 21 3 21 8"></polyline><path d="M21 12a9 9 0 1 1-9-9"></path></svg>
          Reset the canvas
        </button>

        <div class="menu-divider"></div>

        <button class="menu-item" id="menu-excalidrawplus">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          Excalidraw+
        </button>
        <button class="menu-item" id="menu-github" onclick="window.open('https://github.com','_blank')">
          <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"></path></svg>
          GitHub
        </button>
        <button class="menu-item" id="menu-follow">
          <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path></svg>
          Follow us
        </button>
        <button class="menu-item" id="menu-discord">
          <svg viewBox="0 0 24 24"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"></path></svg>
          Discord chat
        </button>
        <button class="menu-item sign-in-btn" id="menu-signin">
          <svg viewBox="0 0 24 24"><path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Sign in
        </button>
      </nav>

      <div class="menu-footer">
        <p class="menu-section-label">Preferences</p>
        
        <div class="preference-row">
          <span>Theme</span>
          <div class="theme-switcher">
            <button class="theme-btn" id="theme-light-btn" title="Light Theme">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="theme-btn active" id="theme-dark-btn" title="Dark Theme">
              <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
            <button class="theme-btn" id="theme-desktop-btn" title="System Theme">
              <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </button>
          </div>
        </div>

        <div class="preference-row">
          <select id="lang-selector">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
        </div>

        <div class="preference-row">
          <span>Canvas background</span>
          <!-- background color options would go here -->
        </div>
      </div>
    </aside>

    <div id="text-editor-container" class="text-editor-container">
      <textarea id="text-editor" placeholder="Start typing..."></textarea>
    </div>

  </div>

  <script type="module" src="editor.js"></script>
</body>
</html>
